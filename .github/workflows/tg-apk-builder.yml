# Создано Telegram-ботом APK Builder. Не переименовывайте этот файл.
name: Telegram APK Builder
run-name: build-${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id from the Telegram bot"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download job files
        uses: actions/checkout@v4
        with:
          ref: job-${{ inputs.job_id }}
          path: job

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack project
        id: cfg
        run: |
          set -e
          mkdir -p project out
          unzip -q job/project.zip -d project
          echo "module=$(jq -r .module job/job.json)" >> "$GITHUB_OUTPUT"
          echo "fmt=$(jq -r .fmt job/job.json)" >> "$GITHUB_OUTPUT"
          KS_PASS=$(jq -r .ks_pass job/job.json)
          echo "::add-mask::$KS_PASS"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$(jq -r .ks_alias job/job.json)" >> "$GITHUB_ENV"

      - name: Build with Gradle
        working-directory: project
        env:
          MODULE: ${{ steps.cfg.outputs.module }}
          FMT: ${{ steps.cfg.outputs.fmt }}
        run: |
          set -eo pipefail
          if [ "$FMT" = "aab" ]; then TASK=bundleRelease; else TASK=assembleRelease; fi
          if [ "$MODULE" = "." ]; then T="$TASK"; else T=":$(echo "$MODULE" | sed 's#/#:#g'):$TASK"; fi
          PROPS=gradle/wrapper/gradle-wrapper.properties
          WRAPPER=false
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ] && [ -f "$PROPS" ]; then
            WRAPPER=true; chmod +x gradlew
          fi

          # Minimum Gradle for the project's Android Gradle Plugin (AGP)
          agp_gradle() {
            case "$(echo "$1" | cut -d. -f1,2)" in
              7.0) echo 7.0.2;; 7.1) echo 7.2;; 7.2) echo 7.3.3;; 7.3) echo 7.4.2;; 7.4) echo 7.5.1;;
              8.0|8.1) echo 8.0.2;; 8.2) echo 8.2.1;; 8.3) echo 8.4;; 8.4) echo 8.6;;
              8.5|8.6) echo 8.7;; 8.7) echo 8.9;; 8.8) echo 8.10.2;; 8.9|8.10) echo 8.11.1;;
              8.11|8.12|8.13) echo 8.13;; 9.0) echo 9.1.0;; 9.1) echo 9.3.1;;
              9.*|1[0-9].*) echo 9.3.1;;
              *) echo "";;
            esac
          }
          AGP=$( (grep -rhoE --include='*.gradle' --include='*.gradle.kts' --include='*.toml' \
                   -e "com\.android\.(application|library)['\"]?\)? +version +['\"][0-9][0-9.]*" \
                   -e "com\.android\.tools\.build:gradle:[0-9][0-9.]*" \
                   -e "^[[:space:]]*(agp|agpVersion|agp-version|androidGradlePlugin|android-gradle-plugin|androidGradle|android-gradle)[[:space:]]*=[[:space:]]*['\"][0-9][0-9.]*" \
                   . 2>/dev/null || true) | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?$" | sort -V | tail -1 || true)
          WV=""
          if [ -f "$PROPS" ]; then
            WV=$( (grep -oE 'gradle-[0-9][0-9.]*(-rc-[0-9]+|-milestone-[0-9]+)?-(bin|all)\.zip' "$PROPS" || true) \
                  | sed -E 's/^gradle-//; s/-(bin|all)\.zip$//' | head -1)
          fi
          NEED=$(agp_gradle "$AGP")
          V=$(printf '%s\n' "$WV" "$NEED" | (grep . || true) | sort -V | tail -1)
          [ -n "$V" ] || V=8.11.1

          set_version() {
            V="$1"
            if [ "$WRAPPER" = true ]; then
              sed -i -E "s#gradle-[^/]*-(bin|all)\.zip#gradle-${V}-bin.zip#" "$PROPS"
              sed -i '/distributionSha256Sum/d' "$PROPS"
            fi
          }
          run_build() {
            if [ "$WRAPPER" = true ]; then
              G=./gradlew
            else
              if [ ! -x "$RUNNER_TEMP/gradle-$V/bin/gradle" ]; then
                curl -fsSL --retry 3 -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$V-bin.zip" || return 1
                unzip -q -o "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP" || return 1
              fi
              G="$RUNNER_TEMP/gradle-$V/bin/gradle"
            fi
            echo "Gradle $V (wrapper: $WRAPPER, AGP: ${AGP:-unknown})"
            "$G" "$T" --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"
          }

          if [ "$WRAPPER" = true ] && [ "$V" != "$WV" ]; then set_version "$V"; fi
          if run_build; then exit 0; fi
          # The project said which Gradle it needs — retry once with it
          NEW=$( (grep -oE 'Minimum supported Gradle version is [0-9][0-9.]*[0-9]' "$RUNNER_TEMP/build.log" || true) \
                 | grep -oE '[0-9][0-9.]*$' | head -1)
          if [ -n "$NEW" ] && [ "$NEW" != "$V" ]; then
            echo "===== RETRY WITH GRADLE $NEW ====="
            set_version "$NEW"
            run_build
            exit $?
          fi
          exit 1

      - name: Sign
        env:
          MODULE: ${{ steps.cfg.outputs.module }}
          FMT: ${{ steps.cfg.outputs.fmt }}
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          KS="$GITHUB_WORKSPACE/job/keystore.jks"
          if [ ! -f "$KS" ]; then
            KS="$GITHUB_WORKSPACE/out/upload-keystore.jks"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass:env KS_PASS -keypass:env KS_PASS -dname "CN=Android App, O=APK Builder"
          fi
          if [ "$MODULE" = "." ]; then OUTS=project/build/outputs; else OUTS="project/$MODULE/build/outputs"; fi
          if [ "$FMT" = "aab" ]; then
            SRC=$(find "$OUTS/bundle" -name "*.aab" | sort | head -1)
            [ -n "$SRC" ] || { echo "ERROR: .aab not found"; exit 1; }
            cp "$SRC" out/app.aab
            jarsigner -keystore "$KS" -storepass:env KS_PASS -keypass:env KS_PASS \
              -sigalg SHA256withRSA -digestalg SHA-256 out/app.aab "$KS_ALIAS"
          else
            SRC=$(find "$OUTS/apk" -name "*.apk" | sort | head -1)
            [ -n "$SRC" ] || { echo "ERROR: .apk not found"; exit 1; }
            "$BT/zipalign" -P 16 -f 4 "$SRC" out/aligned.apk || "$BT/zipalign" -p -f 4 "$SRC" out/aligned.apk
            "$BT/apksigner" sign --ks "$KS" --ks-pass env:KS_PASS --key-pass env:KS_PASS \
              --ks-key-alias "$KS_ALIAS" --out out/app.apk out/aligned.apk
            rm -f out/aligned.apk out/app.apk.idsig
          fi
          ls -la out

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: result
          path: out/
          retention-days: 1
          if-no-files-found: error
